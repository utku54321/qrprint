<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Print Shop Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--paper:#f6f5f1;--ink:#111;--soft:#6b6b6b;--line:#e2e0da;--accent:#2f5bff;--ok:#0f8a4a}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.5 Archivo,system-ui,sans-serif}
header{background:var(--ink);color:#fff;padding:14px max(4vw,16px);display:flex;gap:12px;align-items:center;flex-wrap:wrap}
header h1{margin:0;font-size:22px;flex:1}
main{max-width:1200px;margin:0 auto;padding:20px 16px}
.grid{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:20px}
@media(max-width:860px){.grid{grid-template-columns:minmax(0,1fr)}}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px}
h2{margin:0 0 10px;font-size:19px}
table{width:100%;border-collapse:collapse;font-size:15px}
th{text-align:left;color:var(--soft);font-weight:600;font-size:13px;border-bottom:1px solid var(--line);padding:6px}
td{padding:10px 6px;border-bottom:1px solid var(--line);vertical-align:middle}
td.num{text-align:right;white-space:nowrap}
.code{font-size:22px;font-weight:800;letter-spacing:.05em}
.tag{display:inline-block;border-radius:20px;padding:2px 10px;font-size:13px;font-weight:600;white-space:nowrap}
.queued{background:#fff4d6;color:#8a5a00}.printed{background:#e9f7ef;color:var(--ok)}.collected{background:#eee;color:#666}
.btn{border:0;border-radius:10px;background:var(--accent);color:#fff;font:600 15px Archivo,sans-serif;padding:9px 14px;min-height:42px;cursor:pointer;white-space:nowrap}
.btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line)}
.btn:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.toggle{display:flex;gap:8px;align-items:center;cursor:pointer;color:#fff}
.toggle input{width:20px;height:20px}
.poster{text-align:center}
.poster img{width:100%;max-width:260px;display:block;margin:8px auto}
.poster .big{font-size:26px;font-weight:800;margin:0}
.muted{color:var(--soft);font-size:14px}
.empty{color:var(--soft);text-align:center;padding:30px}
#login{max-width:360px;margin:60px auto}
#login input{width:100%;font:inherit;font-size:16px;padding:12px;border:1px solid var(--line);border-radius:10px;margin:8px 0}
.stats{display:flex;gap:18px;flex-wrap:wrap;margin-bottom:14px}
.stats div{font-size:14px;color:var(--soft)}.stats b{display:block;font-size:26px;color:var(--ink)}
@media(max-width:600px){thead{display:none}tr{display:grid;grid-template-columns:1fr auto;gap:4px;padding:10px 0;border-bottom:1px solid var(--line)}td{border:0;padding:2px 0}td.num{text-align:left}}
#printArea{display:none}
@page{size:A4;margin:0}
@media print{
  body>*:not(#printArea){display:none!important}
  #printArea{display:block}
  #printArea img.pg{width:210mm;height:297mm;display:block;object-fit:contain;break-after:page;page-break-after:always}
  #printArea .blank{width:210mm;height:297mm;break-after:page;page-break-after:always}
}
</style>
</head>
<body>
<header id="top" hidden>
  <h1 id="title">Print shop</h1>
  <label class="toggle"><input type="checkbox" id="auto"> Auto-print new jobs</label>
  <button class="btn ghost" id="logout">Lock</button>
</header>

<div id="login" class="card">
  <h2>Shop dashboard</h2>
  <p class="muted">Enter the shop PIN set on the server.</p>
  <input type="password" id="pin" inputmode="numeric" placeholder="PIN" autocomplete="current-password">
  <button class="btn" id="go" style="width:100%">Open dashboard</button>
  <p class="muted" id="loginErr"></p>
</div>

<main id="app" hidden>
  <div class="grid">
    <div class="card">
      <div class="stats"><div><b id="stQueued">0</b>waiting</div><div><b id="stToday">0</b>jobs today</div><div><b id="stRevenue">₹0</b>earned today</div></div>
      <h2>Print queue</h2>
      <table><thead><tr><th>Code</th><th>Customer</th><th class="num">Pages</th><th class="num">Copies</th><th>Sides</th><th class="num">Paid</th><th>Status</th><th></th></tr></thead>
        <tbody id="jobs"></tbody></table>
      <div class="empty" id="empty">No jobs yet. Customers scan the QR to send prints here.</div>
    </div>
    <div class="card poster" id="poster">
      <p class="big">Scan to print</p>
      <img id="qr" alt="QR code for the customer print page">
      <p class="muted">Upload · pay online · collect here<br>Black & white A4</p>
      <button class="btn ghost" id="printQr">Print this QR poster</button>
    </div>
  </div>
</main>
<div id="printArea"></div>

<script>
{
const $ = id => document.getElementById(id);
let pin = '';
try { pin = localStorage.getItem('shopPin') || ''; } catch {}
let jobs = [], seen = new Set(), printing = false, autoQ = [];
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const api = (url, opt = {}) => fetch(url, { ...opt, headers: { 'x-shop-pin': pin, 'Content-Type': 'application/json', ...(opt.headers || {}) } })
  .then(r => { if (r.status === 401) throw new Error('Wrong PIN'); return r.json(); });

async function login() {
  try {
    jobs = await api('/api/shop/jobs');
    try { localStorage.setItem('shopPin', pin); } catch {}
    $('login').hidden = true; $('app').hidden = false; $('top').hidden = false;
    const c = await fetch('/api/config').then(r => r.json());
    $('title').textContent = c.shopName + ' — dashboard';
    $('qr').src = '/api/shop/qr.svg';
    jobs.forEach(j => seen.add(j.id));
    draw(); setInterval(refresh, 4000);
  } catch (e) { $('loginErr').textContent = e.message; }
}
$('go').onclick = () => { pin = $('pin').value.trim(); login(); };
$('pin').onkeydown = e => { if (e.key === 'Enter') $('go').click(); };
$('logout').onclick = () => { try { localStorage.removeItem('shopPin'); } catch {} location.reload(); };
try { $('auto').checked = localStorage.getItem('autoPrint') === '1'; } catch {}
$('auto').onchange = () => { try { localStorage.setItem('autoPrint', $('auto').checked ? '1' : '0'); } catch {} };
if (pin) login();

async function refresh() {
  try {
    jobs = await api('/api/shop/jobs');
    const fresh = jobs.filter(j => !seen.has(j.id));
    fresh.forEach(j => seen.add(j.id));
    if (fresh.length) beep();
    if ($('auto').checked) { autoQ.push(...fresh.filter(j => j.status === 'queued').reverse()); runAuto(); }
    draw();
  } catch {}
}
function draw() {
  const today = new Date().toDateString();
  const t = jobs.filter(j => new Date(j.createdAt).toDateString() === today);
  $('stQueued').textContent = jobs.filter(j => j.status === 'queued').length;
  $('stToday').textContent = t.length;
  $('stRevenue').textContent = '₹' + t.reduce((s, j) => s + j.amount, 0);
  $('empty').hidden = jobs.length > 0;
  $('jobs').innerHTML = jobs.map(j => `<tr>
    <td><span class="code">${esc(j.code)}</span><div class="muted">${new Date(j.createdAt).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}</div></td>
    <td>${esc(j.name || '—')}</td><td class="num">${j.pages}</td><td class="num">${j.copies}</td>
    <td>${j.duplex ? '<b>Both sides</b>' : 'One side'}</td><td class="num">₹${j.amount}</td>
    <td><span class="tag ${esc(j.status)}">${esc(j.status)}</span></td>
    <td style="white-space:nowrap"><button class="btn" data-print="${esc(j.id)}">${j.status === 'queued' ? 'Print' : 'Reprint'}</button>
      ${j.status === 'printed' ? `<button class="btn ghost" data-done="${esc(j.id)}">Collected</button>` : ''}</td></tr>`).join('');
}
$('jobs').onclick = async e => {
  const p = e.target.dataset.print, d = e.target.dataset.done;
  if (p) printJob(jobs.find(j => j.id === p));
  if (d) { await api(`/api/shop/jobs/${d}/status`, { method: 'POST', body: JSON.stringify({ status: 'collected' }) }); refresh(); }
};

// Print a job: one full-bleed A4 image per page, copies collated.
// For double-sided jobs with an odd page count, a blank page is added after each copy so copies never share a sheet.
async function printJob(j) {
  if (!j || printing) return;
  printing = true;
  const area = $('printArea'); area.innerHTML = '';
  const imgs = [];
  for (let n = 1; n <= j.pages; n++) {
    const im = new Image(); im.className = 'pg'; im.src = `/api/shop/jobs/${j.id}/page/${n}?pin=${encodeURIComponent(pin)}`; imgs.push(im);
  }
  await Promise.all(imgs.map(im => im.decode().catch(() => {})));
  for (let c = 0; c < j.copies; c++) {
    imgs.forEach(im => area.append(im.cloneNode()));
    if (j.duplex && j.pages % 2 && j.copies > 1 && c < j.copies - 1) { const b = document.createElement('div'); b.className = 'blank'; area.append(b); }
  }
  await Promise.all([...area.querySelectorAll('img')].map(im => im.decode().catch(() => {})));
  document.title = `Job ${j.code}${j.duplex ? ' (2-sided)' : ''}`;
  window.print();                       // with Chrome --kiosk-printing this goes straight to the default printer
  document.title = 'Print Shop Dashboard';
  await api(`/api/shop/jobs/${j.id}/status`, { method: 'POST', body: JSON.stringify({ status: 'printed' }) }).catch(() => {});
  area.innerHTML = ''; printing = false; refresh();
}
async function runAuto() {
  if (printing) return;
  const j = autoQ.shift(); if (!j) return;
  await printJob(j); setTimeout(runAuto, 1500);
}
$('printQr').onclick = () => {
  const area = $('printArea');
  area.innerHTML = `<div style="width:210mm;height:297mm;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:Archivo,sans-serif;text-align:center">
    <div style="font-size:64px;font-weight:800">Scan to print</div>
    <img src="/api/shop/qr.svg" style="width:140mm;height:140mm;object-fit:contain;margin:12mm 0">
    <div style="font-size:28px">Upload · pay online · collect at the counter</div>
    <div style="font-size:22px;margin-top:6mm;color:#444">Black & white A4</div></div>`;
  const im = area.querySelector('img');
  im.decode().catch(() => {}).then(() => { window.print(); area.innerHTML = ''; });
};
function beep() {
  try { const a = new AudioContext(), o = a.createOscillator(); o.frequency.value = 880; o.connect(a.destination); o.start(); o.stop(a.currentTime + 0.18); } catch {}
}
}
</script>
</body>
</html>
